name: Build and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build, verify and package
        shell: powershell
        run: .\build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: MulchPatcher-windows
          path: dist/*
      - name: Publish tag release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME dist/MulchPatcher.exe dist/MulchPatcher-v1.0.0-windows.zip dist/SHA256SUMS.txt --title "Mulch Patcher $env:GITHUB_REF_NAME" --notes-file docs/release-v1.0.0.md --verify-tag
